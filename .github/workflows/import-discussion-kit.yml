name: Import Discussion Kit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-discussion-kit.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discussion-kit-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import complete upstream source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fL https://github.com/NotReeceHarris/discussion-kit/archive/refs/heads/main.tar.gz -o "$tmp/source.tar.gz"
          mkdir "$tmp/source"
          tar -xzf "$tmp/source.tar.gz" -C "$tmp/source" --strip-components=1
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$tmp/source/" ./
          rm -rf "$tmp"
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
          else
            git commit -m "Import complete Discussion Kit source"
            git push origin HEAD:main
          fi
